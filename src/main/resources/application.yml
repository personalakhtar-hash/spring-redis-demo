server:
  address: 127.0.0.1
  port: ${PORT:8081}
spring:
  application:
    name: spring-redis-demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cache_demo}
    username: ${DB_USER:cache_demo}
    password: ${DB_PASSWORD:local_demo_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2s
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
